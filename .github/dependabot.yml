# Keeps the actions used by the release and lint workflows current.
# The workflows pin each action to an exact commit (with the version in a
# comment); Dependabot opens a pull request that moves the pin when a new
# release comes out. Merging it is the only maintenance needed.
#
# The plugin's own runtime dependency (vendor/plugin-update-checker) is a
# vendored copy, not a package, so it is not tracked here. Watch
# https://github.com/YahnisElsts/plugin-update-checker/releases for that.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
