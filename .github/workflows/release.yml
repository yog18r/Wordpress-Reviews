name: Release

# Publishing a new version:
#   1. Bump the version in if-reviews.php (header + IF_REVIEWS_VERSION),
#      readme.txt (Stable tag) and add a changelog entry in readme.txt.
#   2. Commit, then:  git tag v2.0.1 && git push --tags
# This workflow builds if-reviews.zip and attaches it to a GitHub Release.
# Sites running the plugin pick the update up from there.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin zip
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Verify the version numbers match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER="$(grep -m1 -E '^\s*\*\s*Version:' if-reviews.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')"
          CONST="$(grep -m1 -E "define\(\s*'IF_REVIEWS_VERSION'" if-reviews.php | sed -E "s/.*'IF_REVIEWS_VERSION',[[:space:]]*'([^']+)'.*/\1/")"
          STABLE="$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')"
          echo "tag=$TAG header=$HEADER constant=$CONST stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Version mismatch. Set the plugin header, IF_REVIEWS_VERSION and the readme.txt Stable tag to $TAG before tagging."
            exit 1
          fi

      - name: PHP syntax check
        run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build zip
        run: |
          rm -rf build && mkdir -p build/if-reviews
          rsync -a --exclude-from=.distignore ./ build/if-reviews/
          (cd build && zip -qr ../if-reviews.zip if-reviews)
          unzip -l if-reviews.zip | tail -n 1

      - name: Extract this version's changelog from readme.txt
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^= " v " =[[:space:]]*$" { on = 1; next }
            on && /^(= |== )/ { exit }
            on { print }
          ' readme.txt | sed '/./,$!d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog entry for $VERSION was found in readme.txt." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" if-reviews.zip \
            --title "WP Reviews $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
